<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Tareas</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; margin: 2em; }
    input, select, button { margin: 0.4em; }
    #resultado { margin-top: 1em; white-space: pre; }
  </style>
</head>
<body>
  <h1>Gestor de Tareas</h1>

  <input id="descripcion" placeholder="Descripción de la tarea">
  <select id="prioridad">
    <option value="alta">Alta</option>
    <option value="media" selected>Media</option>
    <option value="baja">Baja</option>
  </select>
  <button id="agregar">Añadir</button>
  <button id="listar">Listar</button>

  <pre id="resultado"></pre>

  <script src="tareas.js"></script>
  <script>
    const gestor = GestorTareas.getInstance();
    const resultado = document.getElementById("resultado");

    document.getElementById("agregar").addEventListener("click", () => {
      const desc = descripcion.value.trim();
      const pri = prioridad.value;
      if (desc) {
        gestor.añadirTarea(new Tarea(desc, pri));
        descripcion.value = "";
      }
    });

    document.getElementById("listar").addEventListener("click", () => {
      resultado.textContent = gestor.listarTareas().join("\n");
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
	<title>Map</title>
</head>
<body>
<script>
// The map() method of Array instances creates a new array populated with
// the results of calling a provided function on every element in the calling array.


const array1 = [1, 4, 9, 16];

// Pass a function to map
const map1 = array1.map((x) => x * 2);

console.log(map1);
// Expected output: Array [2, 8, 18, 32]


// Parameters
// callbackFn
// A function to execute for each element in the array.
// Its return value is added as a single element in the new array.
// The function is called with the following arguments:

// element
// The current element being processed in the array.

// index
// The index of the current element being processed in the array.

// array
// The array map() was called upon.

// Return value
// A new array with each element being the result of the callback function.

// Examples
// Mapping an array of numbers to an array of square roots
// The following code takes an array of numbers and creates a new array
// containing the square roots of the numbers in the first array.


const numbers = [1, 4, 9];
const roots = numbers.map((num) => Math.sqrt(num));
console.log(roots);
// roots is now     [1, 2, 3]
// numbers is still [1, 4, 9]
</script>
</body>
</html>

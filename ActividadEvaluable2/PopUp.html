<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ventana PopUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body class="text-center mt-5">
    <h2>Ventana secundaria</h2>
    <p id="mensajePopUp"></p>

    <button class="btn btn-info m-2" onclick="mostrarDatos()">Mostrar nombre guardado</button>
    <button class="btn btn-success m-2" onclick="enviarSaludo()">Enviar saludo a la principal</button>

    <script>
      function mostrarDatos() {
        const nombre = localStorage.getItem("nombreUsuario");
        const mensaje = document.getElementById("mensajePopUp");
        if (nombre) {
          mensaje.innerHTML = `El nombre guardado es: <b>${nombre}</b>`;
        } else {
          mensaje.innerHTML = "No hay ningún nombre guardado.";
        }
      }

      function enviarSaludo() {
        if (window.opener) {
          window.opener.alert("Saludos desde la ventana secundaria!");
        }
      }
    </script>
  </body>
</html>
